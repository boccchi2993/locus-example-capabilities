name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: build + test + check (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: AGENTS.md and CLAUDE.md must be identical
        run: cmp AGENTS.md CLAUDE.md
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # github: 依赖通过 lockfile 解析——干净 checkout 只凭 manifest + lockfile 安装
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
